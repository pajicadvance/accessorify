plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = mod_version + "+" + stonecutter.current.version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.fzzyhmstrs.me/' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.bawnorton.com/releases' }
    maven { url 'https://maven.shedaniel.me/' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

subsystems {
    parchment {
        minecraftVersion = property("neogradle.subsystems.parchment.minecraftVersion")
        mappingsVersion = property("neogradle.subsystems.parchment.mappingsVersion")
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

jarJar.enable()

jar {
    archiveClassifier = "slim"
}

tasks.named('jarJar') {
    archiveClassifier = ""
}

dependencies {
    // Hard dependencies
    implementation "net.neoforged:neoforge:${property("neo_version")}"
    implementation(jarJar("com.moulberry:mixinconstraints:${project.mixinconstraints_version}")) {
        jarJar.ranged(it, "[1.0.6,)")
    }
    implementation "me.fzzyhmstrs:fzzy_config:${property("fzzy_version")}"
    implementation "io.wispforest:accessories-neoforge:${property("accessories_version")}"

    // Supported mods
    compileOnly "maven.modrinth:sodium-dynamic-lights:${property("sdl_version")}"
    compileOnly "maven.modrinth:owo-lib:${property("owo_version")}"
    compileOnly "maven.modrinth:serene-seasons:${property("sereneseasons_version")}"
    implementation "maven.modrinth:raised:${property("raised_version")}"
    compileOnly "maven.modrinth:notes:${property("notes_version")}"
    compileOnly "maven.modrinth:friends-and-foes-forge:${property("friendsandfoes_version")}"

    // 1.21.1 exclusive supported mods
    compileOnly "maven.modrinth:deeperdarker:${property("deeperdarker_version")}"
    compileOnly "maven.modrinth:fragmentum:${property("fragmentum_version")}"
    compileOnly "maven.modrinth:ars-elixirum:${property("arselixirum_version")}"
    compileOnly "maven.modrinth:extrasoundsforge:${property("extrasounds_version")}"
    if (stonecutter.eval(stonecutter.current.version, "1.21.1")) {
        implementation "maven.modrinth:deeperdarker:${property("deeperdarker_version")}"
        implementation "maven.modrinth:fragmentum:${property("fragmentum_version")}"
        implementation "maven.modrinth:ars-elixirum:${property("arselixirum_version")}"
        implementation "maven.modrinth:extrasoundsforge:${property("extrasounds_version")}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

stonecutter {
    swaps["Accessory"] = eval(current.version, "< 1.21.8")
            ? "import io.wispforest.accessories.api.Accessory;"
            : "import io.wispforest.accessories.api.core.Accessory;"
    swaps["AccessoryRegistry"] = eval(current.version, "< 1.21.8")
            ? "import io.wispforest.accessories.api.AccessoryRegistry;"
            : "import io.wispforest.accessories.api.core.AccessoryRegistry;"
    swaps["AccessoryRenderer"] = eval(current.version, "< 1.21.8")
            ? "import io.wispforest.accessories.api.client.AccessoryRenderer;"
            : "import io.wispforest.accessories.api.client.renderers.AccessoryRenderer;"
    swaps["SimpleAccessoryRenderer"] = eval(current.version, "< 1.21.8")
            ? "import io.wispforest.accessories.api.client.SimpleAccessoryRenderer;"
            : "import io.wispforest.accessories.api.client.renderers.SimpleAccessoryRenderer;"
    swaps["ExpandedContainerImport"] = eval(current.version, "< 1.21.8")
            ? "import io.wispforest.accessories.impl.ExpandedSimpleContainer;"
            : "import io.wispforest.accessories.impl.core.ExpandedContainer;"
}

publishMods {
    file = tasks.jarJar.archiveFile
    changelog = file(getRootDir().path + "/CHANGELOG.md").text
    type = STABLE
    modLoaders.add("neoforge")
    displayName = project.mod_version + " for NeoForge " + stonecutter.current.version

    modrinth {
        accessToken = providers.environmentVariable("MR_KEY")
        projectId = "CVRzrXGP"
        minecraftVersions.add(stonecutter.current.version)
        requires("fzzy-config", "accessories")
        optional("sodium-dynamic-lights")
    }

    curseforge {
        accessToken = providers.environmentVariable("CF_KEY")
        projectId = "1169634"
        minecraftVersions.add(stonecutter.current.version)
        javaVersions.add(stonecutter.eval(stonecutter.current.version, ">=1.20.5")
                ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = true
        requires("fzzy-config", "accessories")
        optional("dynamiclights-reforged")
    }
}